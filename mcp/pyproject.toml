[project]
name = "bot-station-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents see and drive a Bot Station"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
bot-station-mcp = "bot_station_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot_station_mcp"]
